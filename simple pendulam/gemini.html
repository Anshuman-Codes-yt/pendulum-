<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Pendulum Simulation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: radial-gradient(circle at center, #1e1e2f 0%, #0f0f1a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        canvas {
            display: block;
        }

        #ui {
            position: absolute;
            bottom: 20px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.8rem;
            pointer-events: none;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div id="ui">CLICK TO RESET PIVOT</div>
    <canvas id="pendulumCanvas"></canvas>

    <script>
        const canvas = document.getElementById('pendulumCanvas');
        const ctx = canvas.getContext('2d');

        // Physics Constants & State
        let pivotX, pivotY;
        const armLength = 250;
        let angle = Math.PI / 4; // Start at 45 degrees
        let angularVelocity = 0;
        let angularAcceleration = 0;
        
        // Simulation Parameters
        const gravity = 0.8; 
        const damping = 0.998; // Subtle air resistance to prevent infinite energy gain

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            pivotX = canvas.width / 2;
            pivotY = canvas.height / 4;
        }

        function update() {
            // Pendulum Physics Equation: acceleration = -(g / L) * sin(theta)
            angularAcceleration = (-1 * gravity / armLength) * Math.sin(angle);
            
            angularVelocity += angularAcceleration;
            angularVelocity *= damping; // Apply friction
            angle += angularVelocity;
        }

        function draw() {
            // Clear canvas with a slight trail effect (optional, set to 1 for clean)
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Calculate bob position
            const bobX = pivotX + armLength * Math.sin(angle);
            const bobY = pivotY + armLength * Math.cos(angle);

            // Draw Pivot point
            ctx.beginPath();
            ctx.arc(pivotX, pivotY, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#666';
            ctx.fill();

            // Draw Arm
            ctx.beginPath();
            ctx.moveTo(pivotX, pivotY);
            ctx.lineTo(bobX, bobY);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Draw Bob Shadow (Subtle depth)
            ctx.beginPath();
            ctx.arc(bobX + 5, bobY + 5, 20, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fill();

            // Draw Bob
            ctx.beginPath();
            ctx.arc(bobX, bobY, 20, 0, Math.PI * 2);
            
            // Gradient for the bob to give it a metallic/3D look
            const gradient = ctx.createRadialGradient(bobX - 5, bobY - 5, 2, bobX, bobY, 20);
            gradient.addColorStop(0, '#ffffff');
            gradient.addColorStop(1, '#3498db');
            
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // Add a subtle glow
            ctx.shadowBlur = 15;
            ctx.shadowColor = 'rgba(52, 152, 219, 0.5)';
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Handle window resize
        window.addEventListener('resize', init);

        // Interaction: click to nudge the pendulum or reset position
        window.addEventListener('mousedown', (e) => {
            pivotX = e.clientX;
            pivotY = e.clientY;
            angularVelocity += 0.05; // Give it a little push
        });

        // Initialize and Start
        init();
        loop();
    </script>
</body>
</html>
