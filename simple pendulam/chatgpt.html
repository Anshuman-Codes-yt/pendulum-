<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simple Pendulum</title>
<style>
  body {
    margin: 0;
    background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
    overflow: hidden;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// Pendulum properties
const origin = { x: canvas.width / 2, y: 100 };
let length = 300;
let angle = Math.PI / 4; // initial angle (45°)
let angularVelocity = 0;
let angularAcceleration = 0;

const gravity = 0.6; // scaled gravity
const damping = 0.999; // slight air resistance

function update() {
  // Physics: θ'' = -(g / L) * sin(θ)
  angularAcceleration = -(gravity / length) * Math.sin(angle);
  angularVelocity += angularAcceleration;
  angularVelocity *= damping;
  angle += angularVelocity;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Update origin dynamically (centered)
  origin.x = canvas.width / 2;

  // Bob position
  const x = origin.x + length * Math.sin(angle);
  const y = origin.y + length * Math.cos(angle);

  // Draw rod
  ctx.beginPath();
  ctx.moveTo(origin.x, origin.y);
  ctx.lineTo(x, y);
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 2;
  ctx.stroke();

  // Draw pivot
  ctx.beginPath();
  ctx.arc(origin.x, origin.y, 6, 0, Math.PI * 2);
  ctx.fillStyle = "#ffffff";
  ctx.fill();

  // Draw bob
  ctx.beginPath();
  ctx.arc(x, y, 20, 0, Math.PI * 2);
  ctx.fillStyle = "#ffcc00";
  ctx.fill();

  // Shadow (subtle depth)
  ctx.beginPath();
  ctx.ellipse(x, canvas.height - 50, 25, 8, 0, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(0,0,0,0.2)";
  ctx.fill();
}

function animate() {
  update();
  draw();
  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
